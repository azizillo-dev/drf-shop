services:
  web:
    build: .
    container_name: drf_app
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: drf_redis
    ports:
      - "6379:6379"
    restart: unless-stopped